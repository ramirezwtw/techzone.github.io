<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva publicación — Comunidad TechZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <header class="navbar scrolled" role="banner">
    <nav class="nav-container" aria-label="Navegación principal">
      <a href="{{ url_for('main.index') }}" class="nav-logo" aria-label="TechZone inicio">
        <img src="{{ url_for('static', filename='img/logo-techzone.png') }}" alt="TechZone — PCs Colombia" class="logo-img" />
      </a>
      <div class="nav-auth">
        <a href="{{ url_for('community.index') }}" class="btn-secondary btn-sm">← Comunidad</a>
      </div>
    </nav>
  </header>

  <main class="profile-shell">
    <div class="container container-narrow">
      {% include "_flash.html" %}

      <div class="section-label">Comunidad</div>
      <h1 class="profile-title">Nueva publicación</h1>

      <form method="post" class="auth-card" style="max-width:none;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-group">
          <label class="form-label" for="title">Título</label>
          <input class="form-input" type="text" id="title" name="title" value="{{ title }}" required minlength="5" autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="content">Contenido</label>
          <textarea class="form-input" id="content" name="content" rows="8" required minlength="20" placeholder="Comparte tu build, haz una pregunta o cuenta tu experiencia...">{{ content }}</textarea>
        </div>

        <button type="submit" class="btn-primary btn-lg auth-submit">Publicar</button>
      </form>
    </div>
  </main>

</body>
</html>
