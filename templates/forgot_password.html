<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Contraseña — TechZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-page">

  <header class="navbar scrolled" role="banner">
    <nav class="nav-container" aria-label="Navegación principal">
      <a href="{{ url_for('main.index') }}" class="nav-logo" aria-label="TechZone inicio">
        <img src="{{ url_for('static', filename='img/logo-techzone.png') }}" alt="TechZone — PCs Colombia" class="logo-img" />
      </a>
    </nav>
  </header>

  <main class="auth-shell">
    <div class="auth-card fade-up visible">
      <div class="section-label">Recuperar acceso</div>
      <h1 class="auth-title">¿Olvidaste tu contraseña?</h1>
      <p class="auth-desc">Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>

      {% include "_flash.html" %}

      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-input" type="email" id="email" name="email" required autofocus />
        </div>

        <button type="submit" class="btn-primary btn-lg auth-submit">Enviar enlace de recuperación</button>
      </form>

      <p class="auth-switch"><a href="{{ url_for('auth.login') }}">← Volver a iniciar sesión</a></p>
    </div>
  </main>

</body>
</html>
